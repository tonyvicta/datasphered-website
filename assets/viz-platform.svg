<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-label="Diagram: legacy sources flow through a secure bridge into a governed platform with raw, modelled and trusted layers, then out to reporting, data products and AI">
<defs>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="rgba(255,255,255,.035)"/></pattern>
<radialGradient id="glow" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#5fc9d6" stop-opacity=".16"/><stop offset="1" stop-color="#5fc9d6" stop-opacity="0"/></radialGradient>
<linearGradient id="slab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2128"/><stop offset="1" stop-color="#14171d"/></linearGradient>
<linearGradient id="slabHi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3a40"/><stop offset="1" stop-color="#152227"/></linearGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
<style>
.flow{fill:none;stroke:#5fc9d6;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:4 14;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-36}}
.pulse{animation:pulse 3.2s ease-in-out infinite;transform-origin:450px 212px}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style>
</defs>
